name: Update BCRA rates

on:
  schedule:
    # 22:30 UTC = 19:30 Argentina (ART), después de la última actualización diaria indicada por BCRA.
    - cron: '30 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-bcra-rates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fetch and normalize BCRA rates
        run: npm run rates:update

      - name: Test calculations and normalization
        run: npm test

      - name: Commit snapshot when data changed
        shell: bash
        run: |
          if git diff --quiet -- data/rates.json data/history; then
            echo "No hay cambios en las tasas."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/rates.json data/history
          git commit -m "data: update BCRA loan rates"
          git push
